name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  conflict-markers:
    name: Git Conflict Marker Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify No Conflict Markers
        run: python scripts/check_conflict_markers.py

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: mock-service-role-key-for-testing-only
          SUPABASE_PUBLISHABLE_KEY: mock-anon-key-for-testing-only
          ENVIRONMENT: test
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript & Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-building-only
        run: npm run build

